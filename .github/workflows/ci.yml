name: C++ CMake CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build Project
      run: cmake --build build --config Release

    - name: Run Binary
      run: |
        if [ "${{ runner.os }}" = "Windows" ]; then
          ./build/Release/hello_cpp.exe
        else
          ./build/hello_cpp
        fi
      shell: bash

    - name: Prepare Binary for Upload (Linux/macOS)
      if: runner.os != 'Windows'
      run: cp build/hello_cpp hello_cpp-${{ matrix.os }}

    - name: Prepare Binary for Upload (Windows)
      if: runner.os == 'Windows'
      run: cp build/Release/hello_cpp.exe hello_cpp-${{ matrix.os }}.exe
      shell: bash

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: binary-${{ matrix.os }}
        path: hello_cpp-${{ matrix.os }}*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Display Downloaded Files
        run: ls -R ./artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
