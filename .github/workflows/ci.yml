name: C++ CMake CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      fail-fast: false  # Don't cancel Windows/macOS if Ubuntu fails!
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build Project
      run: cmake --build build --config Release

    - name: Run Binary
      run: |
        if [ "${{ runner.os }}" = "Windows" ]; then
          ./build/Release/hello_cpp.exe
        else
          ./build/hello_cpp
        fi
      shell: bash
      
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: hello-cpp-${{ matrix.os }}
        path: |
          build/hello_cpp
          build/Release/hello_cpp.exe

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            hello-cpp-ubuntu-latest/hello_cpp
            hello-cpp-windows-latest/hello_cpp.exe
            hello-cpp-macos-latest/hello_cpp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
